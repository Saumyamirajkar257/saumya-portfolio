  <!-- Traffic Dots -->
  <circle cx="210" cy="103" r="5" fill="#FF5F56" opacity="0.8"/>
  <circle cx="228" cy="103" r="5" fill="#FFBD2E" opacity="0.8"/>
  <circle cx="246" cy="103" r="5" fill="#27C93F" opacity="0.8"/>

