<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Personal Portfolio Website — Architecture &amp; UI</title>
  <desc id="desc">Next.js, FastAPI, Framer Motion and Electric Blue design system architecture.</desc>

  <defs>
    <radialGradient id="portglow" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1683FF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#030609" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1118"/>
      <stop offset="100%" stop-color="#05080C"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternWnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03"/>
    </pattern>
  </defs>

  <!-- Background -->
