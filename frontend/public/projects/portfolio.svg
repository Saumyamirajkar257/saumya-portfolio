  <line x1="335" y1="163" x2="375" y2="163" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round"/>
  <line x1="390" y1="163" x2="430" y2="163" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round"/>
